<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeezSheets</title><style>
:root {color-scheme:dark;font:14px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#142233;color:#f5f7fa;padding:16px}h2{margin:0 0 6px;font-size:18px}p{color:#b9c6d4;line-height:1.4}label{display:block;margin:12px 0 5px}input{width:100%;background:#0c1623;border:1px solid #53657a;color:white;border-radius:7px;padding:10px;font:inherit}button,a.button{width:100%;display:block;border:0;background:#198c79;color:white;padding:10px;margin-top:10px;border-radius:7px;text-decoration:none;text-align:center;font:inherit;font-weight:600;cursor:pointer}.secondary{background:#344e67}.muted{font-size:12px}#open[hidden]{display:none}
</style></head><body>
<h2>GeezSheets</h2><strong id="tokenName">Loading token…</strong>
<p id="message" class="muted">Connecting…</p>
<label for="characterId">Character ID</label><input id="characterId" placeholder="Enter character ID once" autocomplete="off"/>
<button id="save">Link to this token</button>
<a class="button secondary" id="open" href="#" target="_blank" rel="noopener noreferrer" hidden>Open character sheet ↗</a>
<script type="module">
import OBR from 'https://esm.sh/@owlbear-rodeo/sdk@2';
const KEY='io.github.geezjonny.geezowlbear/characterId';
const id=new URLSearchParams(location.search).get('token');
const el=(x)=>document.getElementById(x);
const message=(s)=>el('message').textContent=s;
const sheet=(value)=>{const char=String(value||'').trim();el('characterId').value=char;el('open').hidden=!char;if(char){const u=new URL('https://geezjonny.github.io/GeezSheets/sheet.html');u.searchParams.set('char',char);el('open').href=u.href;}};
OBR.onReady(async()=>{
  try {
    if(!id) throw new Error('No token was supplied');
    const items=await OBR.scene.items.getItems([id]);
    if(items.length!==1) throw new Error('Token no longer exists');
    el('tokenName').textContent=items[0].name||'Character token';
    sheet(items[0].metadata?.[KEY]);
    message(items[0].metadata?.[KEY]?'Already linked. Open its sheet or change the ID.':'Link this token once; the association is saved.');
  } catch(e) { message(e.message); el('save').disabled=true; }
});
el('save').onclick=async()=>{
 const value=el('characterId').value.trim();if(!value){message('Enter a character ID.');return;}
 el('save').disabled=true;
 try{await OBR.scene.items.updateItems([id],items=>{for(const item of items)item.metadata[KEY]=value;});sheet(value);message('Linked! Use this same token menu to open its sheet.');}
 catch(e){message('Failed to link: '+e.message);}finally{el('save').disabled=false;}
};
</script></body></html>
