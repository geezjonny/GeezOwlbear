<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   GeezSheets HP
  </title>
  <link href="./styles.css" rel="stylesheet"/>
 </head>
 <body>
  <h2>
   GeezSheets
   <span style="color:#34d399">
    Live HP
   </span>
  </h2>
  <div id="tokenName">
   Connecting to Owlbear&hellip;
  </div>
  <label for="character">
   Linked character
  </label>
  <select disabled="" id="character">
   <option value="">
    Loading characters&hellip;
   </option>
  </select>
  <button disabled="" id="link">
   Link to this token
  </button>
  <button disabled="" id="unlink">
   Unlink this token
  </button>
  <section hidden="" id="stats">
   <div id="characterName">
   </div>
   <div id="hp">
    &mdash; / &mdash; HP
   </div>
   <div id="barWrap">
    <div id="bar">
    </div>
   </div>
  </section>
  <a class="button" hidden="" id="open" rel="noopener noreferrer" target="_blank">
   Open full character sheet &nearrow;
  </a>
  <p id="status" role="status">
   Connecting&hellip;
  </p>
  <script src="./app.js" type="module">
  </script>
 </body>
</html>
