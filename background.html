<!doctype html><html lang="en"><head><meta charset="utf-8"><title>GeezSheets background</title></head><body>
<script type="module">
import OBR from 'https://esm.sh/@owlbear-rodeo/sdk@2';
const BASE = 'https://geezjonny.github.io/GeezOwlbear/';
const ID = 'io.github.geezjonny.geezowlbear';
OBR.onReady(async () => {
  await OBR.contextMenu.create({
    id: ID + '/character-menu',
    icons: [{
      icon: BASE + 'icon.svg',
      label: 'GeezSheets Link',
      filter: { every: [{ key: 'layer', value: 'CHARACTER' }] }
    }],
    every: [{ key: 'layer', value: 'CHARACTER' }],
    onClick: async (context, elementId) => {
      if (context.items.length !== 1) return;
      const url = new URL(BASE + 'index.html');
      url.searchParams.set('token', context.items[0].id);
      await OBR.popover.open({
        id: ID + '/link-popover',
        url: url.href,
        width: 340,
        height: 340,
        anchorElementId: elementId
      });
    }
  });
});
</script></body></html>
